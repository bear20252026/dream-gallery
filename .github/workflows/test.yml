# Automated test gate: turns "deploy only when everything is green" from a human rule into automation
# Triggers: pushes to main / any PR
# Steps: lint -> typecheck -> unit tests -> build -> backend regression -> browser smoke test (including the light-budget gate)
#
# ── branch protection: exact required check contexts (do not rename these job ids without it) ──
# GitHub reports one check run PER JOB, and the check-run name is the job's `name:` (falling back to
# the job id). The jobs below pin `name:` explicitly so the context strings cannot drift silently if
# someone reorders/re-keys a job. Verified live on main commit a9ff064 (2026-10-12) via
#   gh api repos/<owner>/<repo>/commits/<sha>/check-runs --jq '.check_runs[].name'
# → ["smoke","build-and-test"]  (total_count 2, no legacy status contexts)
# Put BOTH of these in branch protection for main:
#     build-and-test
#     smoke
# The workflow roll-up name "CI" is a check SUITE, not a required check context — requiring "CI" silently
# matches nothing, so the run can go red while protection still passes. Require the two job contexts instead.
# `smoke` has needs: [build-and-test]; if the first fails, `smoke` is skipped and never reports → the
# required check stays "pending" → protection keeps blocking. That is the intended fail-closed behaviour
# (a green workflow therefore cannot be produced by skipping the gates).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manually rebuild the VR screenshot baselines (run once after an intentional visual change; the output must be fetched and committed by hand)
  workflow_dispatch:
    inputs:
      update_vr_baseline:
        description: 'Rebuild the VR screenshot baselines (checked = rebuild only, no comparison; output is uploaded as vr-baselines)'
        type: boolean
        default: false

# No `paths:`/`paths-ignore` filters and no `concurrency:` group on purpose:
# a path filter would let a commit that only touches e.g. lib/ or hill-src/ produce NO checks at all
# (required contexts then sit "pending" forever, or worse, protection reports "Expected — Waiting for status"),
# and a `concurrency: cancel-in-progress` group would cancel the run whose contexts protection needs.
jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up pnpm (for the hill-src sub-project)
        # 2026-10-14 第五轮审计 D:远方山丘是**第二套游戏**(独立 three + TypeScript + Rapier + pnpm + 自带
        # 6 个 Vitest 用例),而根项目三处配置主动把它排除在门禁之外(vitest.config.js 只收 src/__tests__、
        # tsconfig.json 只收 src/types、eslint.config.mjs:14 忽略 hill-src/**)⇒ 它在 main 上可以悄悄坏掉。
        # 刻意**不跑 pnpm build**:它的 vite 配置 emptyOutDir 会覆写已入库的 ../public/hill,而本项目构建
        # 本就不可复现(见 AGENTS),在 CI 里重建只会制造假漂移;产物新鲜度按 AGENTS 的说法本地核对。
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - name: Hill type check + unit tests (BLOCKING)
        working-directory: hill-src
        run: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run test

      - name: Hill solo bundle guard (BLOCKING)
        # 判定"入库的山丘单人产物里没有可用的网络路径":①产物不得含 api/notes,②源码不得有人调
        # room.start()/room.peek()(剩下那段房间代码因此不可达),③__SOLO__ 的折叠来源还在。
        # 读的是**已入库的 public/hill**,所以这一步不需要也不该去 pnpm build(构建不可复现,
        # 在 CI 里重建只会制造假漂移 —— 同上面不跑 build 的理由)。反向验证过:拿 HILL_SOLO=0 的
        # 联机产物跑它,①立刻变红 exit 1 ⇒ 这条闸门不是恒绿的。
        run: node scripts/hill-solo-guard.cjs

      - name: CSP page registry guard (BLOCKING)
        # 分阶段 CSP 的登记表(lib/security.js CSP_INLINE_FREE_PAGES)承诺"这些页面零内联脚本/零事件属性",
        # 服务器才敢对它们摘掉 script-src 的 'unsafe-inline'。日后谁往 lobby.html 加一句 onclick=,
        # 线上表现是"按钮点了没反应"而极难归因 —— 这一步把那句承诺变成每个 PR 都重查的硬闸。
        # 判不了(exit 2:取不到 lib/security.js、登记表空)同样不算绿。
        run: node scripts/admin/csp-page-registry-guard.cjs

      - name: Dependency audit (npm, report-only — not blocking)
        # 供应链体检:先只报告不阻断(npm audit 会因上游新公告频繁变红,硬闸会让单人开发者被第三方公告卡死发布)。
        # 想升级就照输出开 PR;真要变闸门时,去掉下面的 `|| true` 即可(需主人拍板)。
        run: npm audit --audit-level=high || echo "::warning::npm audit reported high/critical advisories (informational, not blocking)"

      - name: ESLint code-style check
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Dependency-cruiser boundary check (config existed since 2026-09; wired into CI 2026-10-08)
        run: npm run depcruise

      - name: Backend deploy manifest guard (BLOCKING — 部署清单必须覆盖真实依赖)
        # 2026-10-12 查出并被修掉的发布阻断级缺陷:backend-sync.sh 的清单原本写死 `lib/*.js`,而 glob
        # 不递归 ⇒ R1/R2 拆出的 lib/repo、lib/upload、lib/migrations 一个都不会被上传。照那份清单发布,
        # 线上 server.js → lib/store → lib/shadow → lib/repo/chat 直接 Cannot find module,pm2 反复重启
        # = 全站 502,而 md5 差集、上传、漂移复核会全部绿灯(清单本身从没往那些子目录看一眼)。
        # 守卫已接进 backend-sync.sh / verify-drift.sh,但那两条**只有人手工跑部署时才会执行**;
        # CI 这一条把同一个判定提前到 PR 上,漏传在合并前就变红,而不是等到发布那天。
        # 判据取 dependency-cruiser 解析的真实依赖图(与上面那道 no-circular 同一解析器,不是人记的目录名)。
        run: node scripts/admin/check-backend-manifest.cjs

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Frontend build (quality gate)
        run: npm run build

      - name: Backend atomic-write regression (no media assets needed)
        run: node scripts/test/test-store.js

      - name: SQLite persistence regression (迁移/DB 权威恢复/_savedAt 仲裁/USE_SQLITE 回退)
        # 2026-10-14 第六轮审计 M-16C:这脚本一直存在,但 `npm test` 与 CI 都没调用它 ⇒
        # SQLite 正在做架构迁移(R1),而它的回归从未在主线上跑过。现在补进来(只加 step,
        # 不加 job —— 分支保护的 required context 是 job id,加 job 会让保护永远 pending)。
        # 同批还修了它自己的"假通过":场景 2 声称"删掉 JSON 从 DB 恢复",而 unlink 实际写在场景 3,
        # 前置条件从未成立;现在先删再断言"此刻真的只剩 DB"。反向验证:把 unlink 去掉 ⇒ 只有那条
        # 前置断言红、旧的那句"从 SQLite 完整恢复"照样绿(正是审计说的"看起来在判,其实没判")。
        run: node scripts/test/test-store-sqlite.js

      - name: Backend API regression (127 assertions - data validation / security boundaries / quiz gate / approval gate)
        run: node scripts/test/test.js

      # 会话机制 46 项(吊销永久 + 过期自愈 + 兼容护栏 + dk 归并收紧)与上传归属 20 项(同 UA 陌生人互不可见)。
      # 这两条只 require lib/*、把 GATE_DATA_FILE 指到系统临时目录,零网络零浏览器 ⇒ 与 npm test 同口径。
      # 补它们的理由:release.sh 跑的是 `npm test`(5 条),而这里原来只跑 2 条 ⇒ "CI 绿"并不等于"后端全测过",
      # 而 CI 绿现在是 main 分支保护的必要项,口径必须对齐。
      - name: Backend session regression (revocation permanence / expiry self-heal / legacy guards)
        run: node scripts/test/test-session.js

      - name: Upload ownership security regression (same-UA strangers isolated / legacy claim binds aid)
        run: node scripts/test/test-upload-security.js

      # ⚠️ KNOWN GAP(刻意不补,别照抄上面两条):scripts/test/test-mobile.js(6 项)要无头浏览器,
      # 而 build-and-test 作业不装 Chromium(只有 smoke 作业装了 playwright-core 的浏览器),
      # 加进来会把 CI 直接打红。它由本地 `npm test`(release.sh 第 3 步)与 smoke 作业分别覆盖。
      #
      # Also non-blocking by design: the `npm audit` step above swallows its own failure (`|| echo warning`),
      # so a high/critical advisory can never turn the workflow red. That is a reporting step, not a gate.
      - name: Type-health baseline (checkJs tiers, BLOCKING)
        run: |
          COUNT=$(npx tsc -p tsconfig.checkjs.json 2>&1 | grep -c "error TS" || true)
          # 单一真相:基线数字只在 scripts/checkjs-baseline.txt 一处。CI 与本地读同一文件,不再手抄。
          # 超过基线即 fail(旧版只 ::warning,恒开的告警等于没有告警)。每批重构后把基线往**下**压。
          BASELINE=$(grep -Eo '[0-9]+' scripts/checkjs-baseline.txt | head -n1 || echo 0)
          [ -n "$BASELINE" ] || BASELINE=0
          DELTA=$(( COUNT - BASELINE ))
          echo "checkJs errors: ${COUNT} (baseline ${BASELINE}, delta ${DELTA})"
          {
            echo "### checkJs baseline"
            echo "- 当前计数: **${COUNT}**"
            echo "- 基线(scripts/checkjs-baseline.txt): **${BASELINE}**"
            echo "- 差值: **${DELTA}** $( [ "$DELTA" -gt 0 ] && echo '(超出 → 阻断,勿再堆类型债)' || [ "$DELTA" -lt 0 ] && echo '(低于基线 → 请把基线往下压到这个数)' || echo '(与基线一致)' )"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -gt "$BASELINE" ]; then
            echo "::error::checkJs errors ${COUNT} exceed baseline ${BASELINE}. 修掉新增类型债,或确有正当理由时把 baseline 调低并说明(每批重构应往下压,不是往上抬)。"
            exit 1
          fi

      - name: Bundle size check (blocking)
        run: |
          MAIN_SIZE=$(wc -c < dist/assets/main-*.js 2>/dev/null || echo 0)
          THREE_SIZE=$(wc -c < dist/assets/three-*.js 2>/dev/null || echo 0)
          echo "main.js: ${MAIN_SIZE} bytes"
          echo "three.js: ${THREE_SIZE} bytes"
          # main over 512KB blocks the build (a hard gate since 2026-08-30, so size regressions cannot accumulate silently)
          if [ "$MAIN_SIZE" -gt 512000 ]; then
            echo "::error::main.js ${MAIN_SIZE} bytes exceeds the 512KB limit"
            exit 1
          fi

  # Browser smoke test: start the local server and run the health gate in a headless browser (canvas / ctx / light budget / page errors)
  smoke:
    # pinned so the required-check context stays literally "smoke" (same value as the job id)
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build

      - name: Install Chromium (playwright-core registry)
        run: npx playwright-core@1.61.1 install --with-deps chromium

      - name: Start local server
        run: |
          SMOKE=1 PORT=3311 node server.js &
          sleep 4
          curl -s -o /dev/null -w "local server: %{http_code}\n" http://127.0.0.1:3311/

      - name: Smoke gate (canvas / ctx / light budget / page errors)
        run: BASE_URL=http://127.0.0.1:3311 PW_BROWSER=chromium node scripts/probe/smoke-gate.js

      - name: Scene screenshot regression (four checkpoints - main world / B612 / King's planet / return; semantic assertions are a hard gate, pixel differences only warn)
        env:
          VR_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.update_vr_baseline && '1' || '' }}
        run: BASE_URL=http://127.0.0.1:3311 PW_BROWSER=chromium node scripts/probe/scene-visual-regression.cjs

      - name: Upload new baselines (manual rebuild only)
        if: github.event_name == 'workflow_dispatch' && inputs.update_vr_baseline
        uses: actions/upload-artifact@v4
        with:
          name: vr-baselines
          path: scripts/probe/baselines/
