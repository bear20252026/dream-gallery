# 自动化测试门禁：把"全绿才部署"从人治变自动化
# 触发：推送到 main / 任意 PR
# 说明：
#  - 前端构建(npm run build)是质量门禁,捕获导入/语法/打包回归
#  - 后端原子写回归(test-store.js)是纯单测,不依赖媒体资源,干净克隆即可全绿
#  - 完整集成测试 test.js / test-mobile.js 需要 photos/videos 媒体资源
#    (videos/ 已 gitignore,不随仓库分发),仅在具备媒体资源的部署机或本地运行:
#      node scripts/test/test.js && node scripts/test/test-mobile.js
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 前端构建(质量门禁)
        run: npm run build

      - name: 后端原子写回归(无需媒体资源)
        run: node scripts/test/test-store.js
