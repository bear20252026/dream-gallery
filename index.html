<script>
// 全局错误捕获:屏幕显示 + 信标回传后台(仅后台可见,2026-07-25)
(function(){
  function beacon(msg,src,line){
    try{
      var body=JSON.stringify({msg:String(msg).slice(0,300),src:String(src||'').slice(0,200),line:line||0});
      if(navigator.sendBeacon){navigator.sendBeacon('/api/track/error',new Blob([body],{type:'application/json'}));}
      else{fetch('/api/track/error',{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:true}).catch(function(){});}
    }catch(e){}
  }
  window.__errBeacon=beacon;
  window.onerror=function(msg,url,line,col,err){beacon(msg,url,line);console.error('ERR:',msg,err);document.getElementById('l').innerHTML='<div style=color:#ff6b6b;font-size:16px;>加载出错: '+msg+'</div><div style=color:#888;font-size:12px;margin-top:8px;>行:'+line+' 列:'+col+'</div>';};
  window.addEventListener('unhandledrejection',function(e){beacon('Promise: '+(e.reason&&e.reason.message||e.reason),e.reason&&e.reason.stack?String(e.reason.stack).split('\n')[1]:'',0);console.error('PROMISE ERR:',e.reason);document.getElementById('l').innerHTML='<div style=color:#ff6b6b;font-size:16px;>加载出错: '+e.reason+'</div>';});
})();
</script>
<script>
// 秒级踢出:SSE 长连接接收服务端踢出指令(审批变更即刻推送),10秒轮询兜底
(function(){
  async function recheck(){
    try{
      const r=await fetch('/api/gate/status');
      if(!r.ok)return;
      const d=await r.json();
      if(d&&d.enter===false)location.reload();
    }catch(e){}
  }
  try{
    const es=new EventSource('/api/gate/watch');
    es.onmessage=function(e){if(e.data==='recheck')recheck();};
  }catch(e){}
  setInterval(recheck,10000);
})();

// ===== 内嵌面板:白板/音乐等分支页面在画廊内打开,关闭即返回,不重新加载 =====
window.openPanel=function(url,title){
  const p=document.getElementById('panelOv');
  document.getElementById('panelTitle').textContent=title||'';
  document.getElementById('panelFrame').src=url;
  p.style.display='flex';
};
// 协议强制阅读锁(2026-07-26):锁定期内隐藏面板关闭键,Esc 同步失效,签了才放行
window.setPanelLock=function(on){
  const b=document.getElementById('panelClose');
  if(b)b.style.visibility=on?'hidden':'visible';
  window.__panelLocked=!!on;
};
window.closePanel=function(){
  if(window.__panelLocked)return; // 协议强制阅读中,禁止关闭
  const p=document.getElementById('panelOv');
  p.style.display='none';
  document.getElementById('panelFrame').src='about:blank'; // 停止面板内音频/画布
};
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePanel();});

// 昆仑灵鉴:退出告别——关闭/刷新页面前,淡出一句「昆仑留着你的光。」(不是弹窗,不拦退出)
window.addEventListener('beforeunload',function(){
  var d=document.createElement('div');
  d.textContent='你带走的不只是记忆。昆仑留着你的光。';
  d.style.cssText='position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;background:rgba(16,8,14,0.92);color:rgba(255,220,190,0.9);font-size:16px;letter-spacing:4px;pointer-events:none;opacity:0;transition:opacity .6s';
  document.body.appendChild(d);
  requestAnimationFrame(function(){d.style.opacity='1';});
});
</script>
<script>
// 临时错误捕获器(排查手机端加载问题):把 JS 错误直接显示在屏幕上
(function(){
  function show(m){
    var el=document.getElementById('errTrap');
    if(!el){
      el=document.createElement('div');el.id='errTrap';
      el.style.cssText='position:fixed;left:0;bottom:0;max-width:100%;max-height:35%;overflow:auto;z-index:99999;color:#ff8080;background:rgba(0,0,0,0.8);font-size:10px;line-height:1.4;padding:6px;white-space:pre-wrap;font-family:monospace';
      (document.body||document.documentElement).appendChild(el);
    }
    el.textContent+=m+'\n';
    if(el.textContent.length>3000)el.textContent=el.textContent.slice(-2000);
  }
  window.addEventListener('error',function(e){
    show('[ERR] '+(e.message||'加载失败')+' @ '+String(e.filename||'').split('/').pop()+':'+(e.lineno||''));
  },true);
  window.addEventListener('unhandledrejection',function(e){
    show('[REJ] '+((e.reason&&(e.reason.message||e.reason))||'未知'));
  });
  // 捕获 console.error(着色器编译失败/THREE 诊断只走这里,不进 window.onerror)
  var _ce=console.error;
  console.error=function(){
    var s='';
    for(var i=0;i<arguments.length;i++){var a=arguments[i];s+=(typeof a==='string'?a:(a&&a.message)||JSON.stringify(a))+' ';}
    show('[CERR] '+s.slice(0,500));
    _ce.apply(console,arguments);
  };
})();
</script>
