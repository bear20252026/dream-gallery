<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>A Day on B612 · 可玩幕间</title>
    <style>
      :root {
        --crimson: #e0324b;
        --pink: #f7a8bf;
        --gold: #f5c451;
        --amber: #ffb066;
        --leaf: #7ddb7a;
        --ochre: #c8873f;
        --rust: #8f4526;
        --stone: #8b8794;
        --indigo: #1b1f3d;
        --twilight: #0b0a1a;
        --ink: #f5efe6;
        --ink-dim: #c3b9cf;
        --panel: rgba(17, 14, 33, 0.88);
        --line: rgba(247, 168, 191, 0.26);
        --ok: #6fe0a8;
        --warn: #f5c451;
        --danger: #e0324b;
        --info: #7fe3e8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--twilight);
        color: var(--ink);
        font:
          14px/1.5 'Inter',
          'PingFang SC',
          'Microsoft YaHei',
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      canvas.drag {
        cursor: grabbing;
      }
      #vig {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(
          ellipse 74% 66% at 50% 46%,
          transparent 34%,
          rgba(7, 5, 16, 0.8) 100%
        );
      }
      #brand {
        position: fixed;
        left: 22px;
        top: 18px;
        z-index: 6;
        pointer-events: none;
        text-shadow: 0 2px 16px rgba(6, 4, 14, 0.95);
      }
      #brand .seal {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 9px;
        background: linear-gradient(155deg, var(--crimson), #8e1c2c);
        color: #fff3e8;
        font-size: 18px;
        transform: rotate(-5deg);
        margin-bottom: 9px;
        box-shadow: 0 5px 18px rgba(224, 50, 75, 0.4);
      }
      #brand h1 {
        margin: 0;
        font-size: clamp(18px, 2.2vw, 26px);
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      #brand h1 em {
        font-style: normal;
        color: var(--pink);
      }
      #brand p {
        margin: 5px 0 0;
        font-size: 12px;
        color: var(--ink-dim);
        max-width: 340px;
      }
      #brand .rule {
        width: 56px;
        height: 2px;
        margin-top: 9px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--gold), var(--crimson) 62%, transparent);
      }
      #top {
        position: fixed;
        right: 18px;
        top: 18px;
        z-index: 9;
        display: flex;
        gap: 8px;
      }
      .tbtn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 38px;
        padding: 0 13px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        backdrop-filter: blur(9px);
        transition:
          background 0.18s,
          border-color 0.18s,
          transform 0.18s;
      }
      .tbtn:hover {
        background: rgba(48, 32, 68, 0.92);
        border-color: rgba(245, 196, 81, 0.55);
        transform: translateY(-1px);
      }
      .tbtn:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .tbtn .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--info);
        box-shadow: 0 0 9px var(--info);
      }
      .tbtn[aria-pressed='false'] .dot {
        background: #6b6480;
        box-shadow: none;
      }
      #hud {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        z-index: 6;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 9px 16px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(10px);
        pointer-events: none;
      }
      #hud .stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-width: 52px;
      }
      #hud .stat b {
        font-size: 15px;
        font-variant-numeric: tabular-nums;
        color: var(--gold);
      }
      #hud .stat span {
        font-size: 10px;
        letter-spacing: 1px;
        color: var(--ink-dim);
      }
      #hp {
        width: 120px;
        height: 8px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #hp i {
        display: block;
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, var(--crimson), var(--gold));
        transition: width 0.3s;
      }
      #panel {
        position: fixed;
        right: 18px;
        top: 66px;
        bottom: 18px;
        width: 288px;
        z-index: 7;
        display: flex;
        flex-direction: column;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--panel);
        backdrop-filter: blur(13px);
        box-shadow: 0 18px 50px rgba(4, 3, 12, 0.6);
        overflow: hidden;
      }
      #panel header {
        padding: 13px 15px 10px;
        border-bottom: 1px solid rgba(247, 168, 191, 0.15);
      }
      #panel header b {
        font-size: 11.5px;
        letter-spacing: 2.2px;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 600;
      }
      #panel header span {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        color: var(--ink-dim);
      }
      #scroll {
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 6px 15px 15px;
        flex: 1;
        scrollbar-width: thin;
        scrollbar-color: rgba(224, 50, 75, 0.8) rgba(255, 255, 255, 0.06);
      }
      #scroll::-webkit-scrollbar {
        width: 10px;
      }
      #scroll::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
        margin: 4px 0;
      }
      #scroll::-webkit-scrollbar-thumb {
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: padding-box;
        background-color: rgba(224, 50, 75, 0.78);
      }
      #scroll::-webkit-scrollbar-thumb:hover {
        background-color: var(--crimson);
      }
      .grp {
        margin-top: 14px;
      }
      .grp > b {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 10.5px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: var(--pink);
        font-weight: 600;
        margin-bottom: 8px;
      }
      .grp > b::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--line), transparent);
      }
      .row {
        margin-bottom: 10px;
      }
      .row label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
        font-size: 12.5px;
        color: #e2dae9;
        margin-bottom: 5px;
      }
      .row label output {
        font-variant-numeric: tabular-nums;
        font-size: 11.5px;
        color: var(--gold);
        background: rgba(245, 196, 81, 0.12);
        border-radius: 5px;
        padding: 1px 6px;
        min-width: 42px;
        text-align: right;
      }
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 18px;
        background: transparent;
        cursor: pointer;
        margin: 0;
      }
      input[type='range']::-webkit-slider-runnable-track {
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--crimson), var(--gold));
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        margin-top: -5.5px;
        border-radius: 50%;
        background: var(--ink);
        border: 2px solid var(--crimson);
        box-shadow: 0 0 0 3px rgba(224, 50, 75, 0.2);
      }
      input[type='range']::-moz-range-track {
        height: 3px;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--crimson), var(--gold));
      }
      input[type='range']::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--ink);
        border: 2px solid var(--crimson);
      }
      input[type='range']:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
        border-radius: 4px;
      }
      .sw {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 9px;
        font-size: 12.5px;
        color: #e2dae9;
      }
      .sw button {
        position: relative;
        width: 40px;
        height: 21px;
        flex: 0 0 40px;
        border-radius: 21px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.09);
        transition: background 0.2s;
      }
      .sw button::after {
        content: '';
        position: absolute;
        left: 2px;
        top: 2px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: rgba(245, 239, 230, 0.68);
        transition: transform 0.22s cubic-bezier(0.3, 1.4, 0.4, 1);
      }
      .sw button[aria-pressed='true'] {
        background: linear-gradient(160deg, var(--crimson), #a52233);
      }
      .sw button[aria-pressed='true']::after {
        transform: translateX(19px);
        background: #fff3e8;
      }
      .sw button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .legend {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: #e2dae9;
      }
      .legend i {
        font-style: normal;
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 7px;
        vertical-align: -1px;
      }
      .acts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 13px;
      }
      .acts button {
        min-height: 38px;
        border-radius: 9px;
        border: 1px solid var(--line);
        cursor: pointer;
        font: inherit;
        font-size: 12.5px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.07);
        transition:
          background 0.18s,
          transform 0.18s;
      }
      .acts button:hover {
        background: rgba(224, 50, 75, 0.24);
        transform: translateY(-1px);
      }
      .acts button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .acts button.wide {
        grid-column: span 2;
        background: linear-gradient(150deg, rgba(245, 196, 81, 0.22), rgba(224, 50, 75, 0.24));
        border-color: rgba(245, 196, 81, 0.45);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translate(-50%, 14px);
        z-index: 20;
        padding: 9px 18px;
        border-radius: 22px;
        background: rgba(17, 14, 33, 0.95);
        border: 1px solid rgba(245, 196, 81, 0.45);
        color: var(--gold);
        font-size: 12.5px;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.3s,
          transform 0.3s;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #ov {
        position: fixed;
        inset: 0;
        z-index: 15;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(7, 6, 19, 0.72);
        backdrop-filter: blur(6px);
      }
      #ov .card {
        max-width: 520px;
        margin: 20px;
        padding: 26px 28px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
        box-shadow: 0 24px 70px rgba(4, 3, 12, 0.7);
      }
      #ov h2 {
        margin: 0 0 6px;
        font-size: 24px;
        color: var(--gold);
        letter-spacing: 1px;
      }
      #ov p {
        margin: 8px 0;
        color: var(--ink-dim);
        font-size: 13.5px;
        line-height: 1.7;
      }
      #ov .big {
        font-size: 34px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
        margin: 6px 0;
      }
      #ov button {
        margin-top: 14px;
        min-height: 46px;
        padding: 0 26px;
        border-radius: 12px;
        border: 1px solid rgba(245, 196, 81, 0.55);
        background: linear-gradient(150deg, rgba(245, 196, 81, 0.3), rgba(224, 50, 75, 0.32));
        color: #ffe9c2;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
      }
      #ov button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      #ov[hidden] {
        display: none;
      }
      @media (max-width: 900px) {
        #panel {
          right: 12px;
          left: 12px;
          width: auto;
          top: auto;
          bottom: 12px;
          max-height: 42vh;
        }
        #brand {
          left: 14px;
          top: 12px;
        }
        #brand p {
          display: none;
        }
        #top {
          right: 12px;
          top: 12px;
        }
        .tbtn span.lbl {
          display: none;
        }
        #hud {
          top: auto;
          bottom: calc(42vh + 20px);
          gap: 10px;
          padding: 7px 12px;
        }
        #hp {
          width: 80px;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="vig"></div>
    <div id="brand">
      <div class="seal">B6</div>
      <h1>A Day on <em>B612</em></h1>
      <p>拔猴面包树 · 浇玫瑰 · 通火山。拖动旋转，滚轮缩放，点击发光的目标照料她的小星球。</p>
      <div class="rule"></div>
    </div>
    <div id="top">
      <button class="tbtn" id="sound" aria-pressed="true" title="静音/恢复">
        <i class="dot"></i><span class="lbl">声音 开</span>
      </button>
      <button class="tbtn" id="hide" aria-pressed="false" title="隐藏/显示控制台">控制台</button>
    </div>
    <div id="hud">
      <div class="stat"><b id="hScore">0</b><span>分数</span></div>
      <div class="stat"><b id="hWave">1/6</b><span>波次</span></div>
      <div class="stat"><b id="hTime">12</b><span>秒</span></div>
      <div class="stat">
        <div id="hp"><i></i></div>
        <span>星球</span>
      </div>
    </div>
    <aside id="panel">
      <header><b>Gardener Console</b><span>点击发光目标照料 · 拖动旋转 · 滚轮缩放</span></header>
      <div id="scroll">
        <div class="grp">
          <b>玩法 Rules</b>
          <div class="legend">
            <span><i style="background: var(--leaf)"></i>绿环=猴面包树幼苗：长大前拔掉。</span>
            <span><i style="background: var(--info)"></i>蓝滴=玫瑰口渴：点击浇水。</span>
            <span><i style="background: var(--amber)"></i>橙环=火山冒烟：点击疏通。</span>
          </div>
        </div>
        <div class="grp">
          <b>难度 Difficulty</b>
          <div class="row">
            <label for="diff">幼苗生长速度 <output id="diffO">1.0</output></label
            ><input type="range" id="diff" min="0.5" max="2" step="0.1" value="1" />
          </div>
          <div class="row">
            <label for="rate">幼苗出现频率 <output id="rateO">1.0</output></label
            ><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1" />
          </div>
        </div>
        <div class="grp">
          <b>镜头 Camera</b>
          <div class="row">
            <label for="zoom">远近 <output id="zoomO">1.0</output></label
            ><input type="range" id="zoom" min="0.7" max="1.6" step="0.05" value="1" />
          </div>
          <div class="sw"><span>自动旋转</span><button id="spin" aria-pressed="true"></button></div>
          <div class="sw">
            <span>网格参考</span><button id="grid" aria-pressed="false"></button>
          </div>
        </div>
        <div class="acts">
          <button id="pause">暂停</button>
          <button id="reset">重开</button>
          <button id="shot" class="wide">导出画面 PNG</button>
        </div>
      </div>
    </aside>
    <div id="toast"></div>
    <div id="ov">
      <div class="card">
        <h2 id="ovTitle">A Day on B612</h2>
        <p id="ovText">
          猴面包树的幼苗会悄悄顶开土壤——在绿环长大前拔掉；玫瑰渴了（蓝滴）要浇水；火山冒烟（橙环）要疏通。撑过六波，守住这颗小星球。
        </p>
        <div class="big" id="ovScore" hidden>0</div>
        <button id="ovBtn">开始这一天</button>
      </div>
    </div>
    <script type="importmap">
      {
        "imports": { "three": "./three/three.module.js", "three/addons/": "./three/examples/jsm/" }
      }
    </script>
