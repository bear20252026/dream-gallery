      var firstFrame = true;
      function heartbeat(t) {
        const p = (t % 1.7) / 1.7;
        return (
          Math.exp(-Math.pow((p - 0.06) / 0.045, 2)) +
          0.65 * Math.exp(-Math.pow((p - 0.24) / 0.055, 2))
        );
      }
      function tick() {
        requestAnimationFrame(tick);
        const delta = Math.min(clock.getDelta(), 0.05),
          dt = reducedMotion.matches ? 0 : delta;
        time += dt;
        const t = time,
          tn = now();
        spin.rotation.y += dt * 0.045;
        if (tween) {
          const k = clamp((tn - tween.start) / tween.duration, 0, 1);
          const eased = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
          camera.position.lerpVectors(tween.p0, tween.p1, eased);
          controls.target.lerpVectors(tween.t0, tween.t1, eased);
          if (k >= 1) tween = null;
        }
        controls.autoRotate = !reducedMotion.matches && !tween && !dragging && tn > idleUntil;
        controls.update(delta);
        camera.updateMatrixWorld();
        camFill.position.copy(camera.position).normalize().multiplyScalar(14);
        backRim.position.copy(camera.position).sub(controls.target).normalize().multiplyScalar(-14);
        backRim.position.y += 5;
        layers.forEach((layer, i) =>
          layer.scale.setScalar(1.012 + 0.01 * Math.sin(t * 0.9 + i * 0.8))
        );
        const beat = heartbeat(t),
          glow = 0.5 + 0.5 * Math.sin(t * 0.9);
        heartMaterial.emissiveIntensity = 0.75 + beat * 0.7;
        heartLight.intensity = 0.065 + beat * 0.08;
        heart.scale.set(0.095, 0.11, 0.095).multiplyScalar(1 + beat * 0.035);
        roseLight.intensity = 0.65 + glow * 0.1;
        domeLight.intensity = 0.22 + glow * 0.12;
        moteMaterial.opacity = 0.32 + glow * 0.2;
        for (let i = 0; i < MOTES; i++) {
          const m = moteData[i],
            a = m.a + t * m.speed;
          motePositions[i * 3] = Math.cos(a) * m.r;
          motePositions[i * 3 + 1] = gY + m.y + Math.sin(t * 0.6 + m.phase) * 0.08;
          motePositions[i * 3 + 2] = Math.sin(a) * m.r;
        }
        moteGeometry.attributes.position.needsUpdate = true;
        const flicker = 0.5 + 0.3 * Math.sin(t * 2.1) + 0.15 * Math.sin(t * 5.3);
        emberMaterial.emissiveIntensity = 0.55 + flicker * 0.5;
        emberLight.intensity = 0.38 + flicker * 0.22;
        smoke.forEach((puff, i) => {
          const life = (t * 0.09 + i / smoke.length) % 1;
          puff.position
            .copy(smokeBase)
            .addScaledVector(av.d, 0.12 + life * 2.6)
            .addScaledVector(
              smokeTangent,
              Math.sin(life * 5 + i * 0.7) * 0.13 * life + life * life * 0.5
            );
          puff.scale.setScalar(0.13 + life * 0.5);
          puff.material.opacity = 0.19 * Math.sin(life * Math.PI) * (1 - life);
          puff.material.rotation = life * 0.6 + i;
        });
        const cycle = t % 24,
          a0 = 0.9;
        if (cycle < 14) {
          loosePetal.visible = true;
          loosePetal.position.set(
            Math.cos(a0) * 0.35,
            bloom.position.y + 0.42,
            Math.sin(a0) * 0.35
          );
          loosePetal.rotation.set(0.5, -a0 + Math.PI / 2, 0);
          loosePetal.scale.setScalar(Math.max(0.01, smooth(cycle, 0, 0.8)));
          looseMaterial.opacity = 1;
        } else if (cycle < 22) {
          const p = (cycle - 14) / 8,
            a = a0 + p * 6,
            radius = 0.35 + p * 0.38;
          loosePetal.visible = true;
          loosePetal.scale.setScalar(1);
          loosePetal.position.set(
            Math.cos(a) * radius,
            lerp(bloom.position.y + 0.42, gY + 0.2, Math.pow(p, 1.6)),
            Math.sin(a) * radius
          );
          loosePetal.rotation.set(0.5 + p * 2.2, -a + Math.PI / 2 + p * 3, Math.sin(p * 11) * 0.5);
          looseMaterial.opacity = 1 - smooth(p, 0.8, 1);
        } else loosePetal.visible = false;
        const phase = t % 16,
          pour = smooth(phase, 9, 10) * (1 - smooth(phase, 12.8, 13.8));
        can.rotation.x = -0.28 * pour;
        spout.getWorldPosition(spoutPosition);
        spin.worldToLocal(spoutPosition);
        pourDirection.set(-spoutPosition.x, -spoutPosition.z).normalize().multiplyScalar(0.22);
        drops.forEach((drop, i) => {
          const p = (t * 1.1 + i / drops.length) % 1;
          drop.visible = pour > 0.3 && p < 0.98;
          drop.position.set(
            spoutPosition.x + pourDirection.x * p,
            lerp(spoutPosition.y, gY + 0.04, p * p),
            spoutPosition.z + pourDirection.y * p
          );
          drop.scale.set(0.012, 0.023, 0.012).multiplyScalar(1 - 0.3 * p);
        });
        starMaterial.uniforms.time.value = t;
        for (const d of drifters) {
          const angle = d.angle + t * d.speed,
            twinkle = 0.5 + 0.5 * Math.sin(t * d.twinkle + d.phase);
          d.sprite.position.set(
            Math.cos(angle) * d.radius,
            d.y + Math.sin(t * 0.5 + d.phase) * 0.45,
            Math.sin(angle) * d.radius
          );
          d.sprite.material.opacity = 0.45 + twinkle * 0.5;
          d.sprite.scale.setScalar(0.17 + 0.035 * twinkle);
        }
        for (let i = 0; i < beltData.length; i++) {
          const b = beltData[i],
            a = b.angle + t * b.speed;
          dummy.position.set(
            Math.cos(a) * b.radius,
            b.y + Math.sin(t * (0.32 + i * 6e-3) + b.phase) * 0.09,
            Math.sin(a) * b.radius
          );
          dummy.rotation.set(t * 0.025 + b.phase, t * 0.04 + b.phase, t * 0.018);
          dummy.scale.setScalar(b.size);
          dummy.updateMatrix();
          beltMesh.setMatrixAt(i, dummy.matrix);
        }
        beltMesh.instanceMatrix.needsUpdate = true;
        for (const f of floaters) {
          const a = f.angle + t * f.speed;
          f.rock.position.set(
            Math.cos(a) * f.radius,
            f.y + Math.sin(t * f.frequency + f.phase) * f.bob,
            Math.sin(a) * f.radius
          );
          f.rock.rotation.set(t * f.rx, t * f.ry, t * f.rz);
        }
        for (let i = 0; i < DUST; i++) {
          const d = dustData[i],
            a = d.angle + t * d.speed;
          dustPositions[i * 3] = Math.cos(a) * d.radius;
          dustPositions[i * 3 + 1] = d.y + Math.sin(t * 0.3 + d.phase) * 0.4;
          dustPositions[i * 3 + 2] = Math.sin(a) * d.radius;
        }
        dustGeometry.attributes.position.needsUpdate = true;
        bloom.localToWorld(focus.set(0, 0.4, 0));
        focus.applyMatrix4(camera.matrixWorldInverse);
        bokeh.uniforms.focus.value = Math.max(0.1, -focus.z);
        composer.render();
        if (firstFrame) {
          firstFrame = false;
          document.body.classList.add('ready');
          setTimeout(() => document.getElementById('fade')?.remove(), 2800);
        }
      }
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        const ratio = Math.min(devicePixelRatio || 1, 2);
        renderer.setPixelRatio(ratio);
        renderer.setSize(innerWidth, innerHeight);
        composer.setPixelRatio(ratio);
        composer.setSize(innerWidth, innerHeight);
        starMaterial.uniforms.pixelHeight.value = innerHeight * ratio;
      });
      tick();
    </script>
  </body>
</html>
