<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>天空の鯉 · Koi of the Cloud Sea</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --washi: #f7ece0;
        --washi-dim: rgba(247, 236, 224, 0.6);
        --washi-faint: rgba(247, 236, 224, 0.34);
        --verm: #d8452f;
        --verm-lt: #f0705a;
        --gold: #e7b96b;
        --line: rgba(231, 185, 107, 0.24);
        --panel: linear-gradient(178deg, rgba(28, 18, 30, 0.9), rgba(14, 9, 16, 0.93));
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: #0d0810;
        color: var(--washi);
        font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      canvas {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      .vignette,
      .grain,
      .grade {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .vignette {
        z-index: 2;
        background: radial-gradient(
          ellipse 78% 68% at 50% 46%,
          transparent 40%,
          rgba(16, 7, 18, 0.58) 100%
        );
      }
      .grade {
        z-index: 2;
        mix-blend-mode: soft-light;
        opacity: 0.7;
        background: linear-gradient(
          180deg,
          rgba(255, 163, 84, 0.28),
          rgba(255, 90, 60, 0.05) 45%,
          rgba(60, 40, 120, 0.26)
        );
      }
      .grain {
        z-index: 3;
        opacity: 0.13;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
      }
      .hud {
        position: fixed;
        z-index: 6;
        transition:
          opacity 0.5s ease,
          transform 0.5s ease;
      }
      body.noui .hud:not(#uiBack) {
        opacity: 0;
        pointer-events: none;
        transform: translateY(6px);
      }
      #title {
        top: 26px;
        left: 30px;
        display: flex;
        gap: 16px;
        align-items: flex-start;
        max-width: min(46vw, 560px);
      }
      .seal {
        width: 56px;
        height: 56px;
        flex: 0 0 56px;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #e0503a, #a92b1c);
        color: #fff2e2;
        font-family: 'Shippori Mincho B1', serif;
        font-size: 30px;
        font-weight: 800;
        border-radius: 5px;
        transform: rotate(-4deg);
        box-shadow:
          0 10px 26px rgba(200, 60, 40, 0.36),
          inset 0 0 0 2px rgba(255, 220, 200, 0.22);
        animation: sealIn 1.1s cubic-bezier(0.2, 0.9, 0.2, 1) both 0.25s;
      }
      @keyframes sealIn {
        from {
          opacity: 0;
          transform: rotate(-24deg) scale(0.5);
        }
        to {
          opacity: 1;
          transform: rotate(-4deg) scale(1);
        }
      }
      .eyebrow {
        margin: 2px 0 6px;
        font-size: 10.5px;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 700;
        opacity: 0;
        animation: rise 0.8s ease both 0.45s;
      }
      h1 {
        margin: 0;
        font-family: 'Shippori Mincho B1', serif;
        font-weight: 800;
        font-size: clamp(30px, 4.3vw, 58px);
        line-height: 0.94;
        letter-spacing: -0.012em;
        text-shadow: 0 6px 34px rgba(0, 0, 0, 0.55);
        opacity: 0;
        animation: rise 0.9s ease both 0.55s;
      }
      h1 em {
        font-style: normal;
        color: var(--verm-lt);
        position: relative;
        white-space: nowrap;
      }
      h1 em::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0.06em;
        height: 3px;
        background: var(--verm);
        opacity: 0.65;
        border-radius: 2px;
      }
      .jp-line {
        margin: 10px 0 0;
        font-family: 'Shippori Mincho B1', serif;
        font-size: 13.5px;
        letter-spacing: 0.34em;
        color: var(--washi-dim);
        opacity: 0;
        animation: rise 0.9s ease both 0.7s;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      #strip {
        top: 0;
        right: 0;
        bottom: 0;
        width: 74px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        pointer-events: none;
      }
      #strip .vtxt {
        writing-mode: vertical-rl;
        font-family: 'Shippori Mincho B1', serif;
        font-size: 12px;
        letter-spacing: 0.52em;
        color: rgba(247, 236, 224, 0.42);
      }
      #strip .rule {
        width: 1px;
        height: min(46vh, 420px);
        background: linear-gradient(180deg, transparent, var(--line), transparent);
      }
      #views {
        left: 30px;
        bottom: 28px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        max-width: min(58vw, 620px);
      }
      .chip {
        pointer-events: auto;
        cursor: pointer;
        display: flex;
        align-items: baseline;
        gap: 7px;
        padding: 8px 14px 8px 12px;
        border: 1px solid var(--line);
        border-radius: 2px;
        background: rgba(18, 11, 20, 0.72);
        color: var(--washi-dim);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        font-weight: 500;
        transition:
          transform 0.22s cubic-bezier(0.2, 0.9, 0.2, 1),
          background 0.22s,
          color 0.22s,
          border-color 0.22s,
          box-shadow 0.22s;
      }
      .chip b {
        font-family: 'Shippori Mincho B1', serif;
        font-size: 14px;
        letter-spacing: 0;
        color: var(--gold);
        font-weight: 600;
        transition: color 0.22s;
      }
      .chip:hover {
        transform: translateY(-3px);
        color: var(--washi);
        border-color: rgba(231, 185, 107, 0.55);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
      }
      .chip.on {
        background: linear-gradient(160deg, #d8452f, #a52d1c);
        border-color: rgba(255, 150, 120, 0.5);
        color: #fff3e8;
      }
      .chip.on b {
        color: #ffe6bf;
      }
      #panel {
        right: 96px;
        bottom: 28px;
        width: 262px;
        padding: 16px 16px 14px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 3px;
        box-shadow:
          0 26px 60px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 222, 190, 0.09);
        pointer-events: auto;
        backdrop-filter: blur(3px);
      }
      #panel h2 {
        margin: 0 0 12px;
        font-size: 10px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #panel h2 span {
        font-family: 'Shippori Mincho B1', serif;
        font-size: 13px;
        letter-spacing: 0.1em;
        color: var(--washi-dim);
        text-transform: none;
      }
      #panel h2::after {
        content: '';
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0;
      }
      .row label {
        font-size: 11.5px;
        letter-spacing: 0.05em;
        color: var(--washi-dim);
      }
      .row label i {
        font-style: normal;
        font-family: 'Shippori Mincho B1', serif;
        color: rgba(231, 185, 107, 0.75);
        margin-right: 6px;
        font-size: 12.5px;
      }
      .sw {
        position: relative;
        width: 38px;
        height: 19px;
        flex: 0 0 38px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.14);
        cursor: pointer;
        transition:
          background 0.25s,
          border-color 0.25s;
      }
      .sw::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: rgba(247, 236, 224, 0.6);
        transition:
          transform 0.25s cubic-bezier(0.3, 1.4, 0.4, 1),
          background 0.25s;
      }
      .sw.on {
        background: linear-gradient(160deg, #e0503a, #b0301f);
        border-color: rgba(255, 150, 120, 0.45);
      }
      .sw.on::after {
        transform: translateX(19px);
        background: #fff1df;
      }
      .slider {
        -webkit-appearance: none;
        appearance: none;
        width: 112px;
        height: 2px;
        background: rgba(255, 255, 255, 0.18);
        outline: none;
        border-radius: 2px;
      }
      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--gold);
        cursor: pointer;
        box-shadow: 0 0 0 4px rgba(231, 185, 107, 0.16);
      }
      .slider::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border: 0;
        border-radius: 50%;
        background: var(--gold);
        cursor: pointer;
      }
      .stats {
        margin-top: 11px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        font-size: 9.5px;
        letter-spacing: 0.16em;
        color: var(--washi-faint);
        text-transform: uppercase;
      }
      .stats b {
        color: rgba(231, 185, 107, 0.85);
        font-weight: 700;
      }
      #cap {
        right: 96px;
        bottom: calc(28px + 258px);
        max-width: 262px;
        text-align: right;
        pointer-events: none;
      }
      #cap .k {
        font-family: 'Shippori Mincho B1', serif;
        font-size: 19px;
        color: var(--washi);
        letter-spacing: 0.06em;
      }
      #cap .d {
        font-size: 10.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--washi-faint);
        margin-top: 4px;
      }
      #cap .k,
      #cap .d {
        transition: opacity 0.35s;
      }
      #hint {
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(247, 236, 224, 0.34);
        pointer-events: none;
        white-space: nowrap;
      }
      #hint kbd {
        font-family: inherit;
        border: 1px solid var(--line);
        border-radius: 2px;
        padding: 1px 5px;
        color: rgba(231, 185, 107, 0.7);
      }
      #uiBack {
        position: fixed;
        z-index: 7;
        top: 22px;
        right: 22px;
        width: 34px;
        height: 34px;
        display: none;
        place-items: center;
        background: rgba(18, 11, 20, 0.8);
        border: 1px solid var(--line);
        color: var(--gold);
        cursor: pointer;
        border-radius: 3px;
        font-size: 15px;
      }
      body.noui #uiBack {
        display: grid;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: radial-gradient(ellipse at 30% 70%, #2a1420, #0d0810 70%);
        display: flex;
        align-items: flex-end;
        padding: 0 0 12vh 8vw;
        transition:
          opacity 0.9s ease,
          visibility 0.9s;
      }
      #loader.gone {
        opacity: 0;
        visibility: hidden;
      }
      #loader .lk {
        font-family: 'Shippori Mincho B1', serif;
        font-size: clamp(60px, 12vw, 150px);
        line-height: 0.9;
        color: rgba(247, 236, 224, 0.1);
        position: absolute;
        top: 8vh;
        left: 8vw;
      }
      #loader .inner {
        position: relative;
        max-width: 520px;
      }
      #loader .t1 {
        font-size: 10.5px;
        letter-spacing: 0.44em;
        text-transform: uppercase;
        color: var(--gold);
        font-weight: 700;
      }
      #loader .t2 {
        font-family: 'Shippori Mincho B1', serif;
        font-size: clamp(26px, 4vw, 42px);
        margin: 12px 0 20px;
        line-height: 1.1;
      }
      #bar {
        height: 2px;
        background: rgba(255, 255, 255, 0.12);
        position: relative;
        overflow: hidden;
      }
      #barFill {
        position: absolute;
        inset: 0;
        width: 0%;
        background: linear-gradient(90deg, var(--verm), var(--gold));
        transition: width 0.3s;
      }
      #loadTxt {
        margin-top: 12px;
        font-size: 11.5px;
        letter-spacing: 0.1em;
        color: var(--washi-dim);
        display: flex;
        justify-content: space-between;
      }
      #loadTxt b {
        color: var(--gold);
        font-weight: 500;
      }
      .lp {
        position: absolute;
        width: 8px;
        height: 7px;
        background: rgba(247, 190, 205, 0.55);
        border-radius: 60% 40% 55% 45%/55% 60% 40% 45%;
        top: -8vh;
        animation: petalfall linear infinite;
      }
      @keyframes petalfall {
        0% {
          transform: translate3d(0, -10vh, 0) rotate(0deg);
          opacity: 0;
        }
        12% {
          opacity: 0.85;
        }
        100% {
          transform: translate3d(14vw, 110vh, 0) rotate(540deg);
          opacity: 0;
        }
      }
      @media (max-width: 900px) {
        #strip {
          display: none;
        }
        #panel {
          right: 16px;
          left: 16px;
          bottom: 96px;
          width: auto;
        }
        #cap {
          display: none;
        }
        #views {
          left: 16px;
          right: 16px;
          bottom: 20px;
          max-width: none;
          flex-wrap: nowrap;
          overflow-x: auto;
          padding-bottom: 4px;
        }
        #title {
          left: 18px;
          top: 18px;
          max-width: 78vw;
        }
        .seal {
          width: 44px;
          height: 44px;
          flex-basis: 44px;
          font-size: 23px;
        }
        #hint {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="lk">鯉</div>
      <div class="inner">
        <div class="t1">Sky Garden · 建造中</div>
        <div class="t2">Raising a garden<br />on the back of a koi.</div>
        <div id="bar"><div id="barFill"></div></div>
        <div id="loadTxt"><span id="loadStep">warming the sunset…</span><b id="loadPct">0%</b></div>
      </div>
    </div>

    <div class="grade"></div>
    <div class="vignette"></div>
    <div class="grain"></div>

    <header class="hud" id="title">
      <div class="seal">鯉</div>
      <div>
        <p class="eyebrow">Stylized realism · 空中庭園</p>
        <h1>KOI OF THE<br /><em>CLOUD SEA</em></h1>
        <p class="jp-line">夕日 · 花筏 · 落水</p>
      </div>
    </header>

    <div class="hud" id="strip">
      <div class="rule"></div>
      <div class="vtxt">天空を泳ぐ鯉と庭園</div>
      <div class="rule"></div>
    </div>

    <div class="hud" id="cap">
      <div class="k">遠景 · wide orbit</div>
      <div class="d">cinematic drift</div>
    </div>

    <aside class="hud" id="panel">
      <h2><span>調整</span> controls</h2>
      <div class="row">
        <label><i>回</i>Auto orbit</label>
        <div class="sw on" id="swOrbit"></div>
      </div>
      <div class="row">
        <label><i>速</i>Orbit speed</label
        ><input class="slider" id="sldSpeed" type="range" min="0" max="200" value="70" />
      </div>
      <div class="row">
        <label><i>日</i>Sun height</label
        ><input class="slider" id="sldSun" type="range" min="0" max="100" value="34" />
      </div>
      <div class="row">
        <label><i>光</i>Bloom</label>
        <div class="sw on" id="swBloom"></div>
      </div>
      <div class="row">
        <label><i>水</i>Waterfalls</label>
        <div class="sw on" id="swWater"></div>
      </div>
      <div class="row">
        <label><i>花</i>Petals</label>
        <div class="sw on" id="swPetals"></div>
      </div>
      <div class="stats">
        <span>tris <b id="statTris">—</b></span
        ><span>fps <b id="statFps">—</b></span>
      </div>
    </aside>

    <nav class="hud" id="views">
      <button class="chip on" data-v="0"><b>遠</b>wide</button>
      <button class="chip" data-v="1"><b>鳥</b>torii</button>
      <button class="chip" data-v="2"><b>庭</b>garden</button>
      <button class="chip" data-v="3"><b>雲</b>cloud sea</button>
      <button class="chip" data-v="4"><b>尾</b>butterfly tail</button>
    </nav>

    <div class="hud" id="hint">
      drag to look · scroll to zoom · <kbd>1</kbd>–<kbd>5</kbd> views · <kbd>space</kbd> pause ·
      <kbd>H</kbd> hide ui
    </div>
    <div id="uiBack">◉</div>

          sp.position.set(e.x, e.y + 2, e.z);
          world.add(sp);
          updaters.push((dt, t) => {
            sp.scale.setScalar(22 + Math.sin(t * 0.5 + i * 1.7) * 4);
          });
        });
      }
      var petals;
      function buildPetals() {
        const N = 350;
        petals = new THREE.InstancedMesh(
          new THREE.SphereGeometry(0.5, 8, 6),
          std({ roughness: 0.7 }),
          N
        );
        petals.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        petals.frustumCulled = false;
        petals.items = [];
        const cols = [16238806, 15904450, 16506086, 16773364, 15242157],
          c = new THREE.Color();
        for (let i = 0; i < N; i++) {
          petals.items.push({
            p: new THREE.Vector3(),
            v: new THREE.Vector3(),
            r: new THREE.Euler(),
            rs: v3(rr(-2, 2), rr(-2, 2), rr(-2, 2)),
            ph: rnd() * 6.28,
            sc: rr(0.45, 0.8),
          });
          c.set(pick(cols));
          petals.setColorAt(i, c);
          respawnPetal(petals.items[i], true);
        }
        petals.instanceColor.needsUpdate = true;
        world.add(petals);
        const d = new THREE.Object3D();
        updaters.push((dt, t) => {
          const items = petals.items;
          for (let i = 0; i < items.length; i++) {
            const it = items[i];
            it.p.addScaledVector(it.v, dt);
            it.v.x += Math.sin(t * 0.9 + it.ph) * 0.55 * dt;
            it.v.y += (Math.sin(t * 1.4 + it.ph) * 0.35 - 0.3) * dt;
            it.v.z += Math.cos(t * 0.7 + it.ph) * 0.4 * dt;
            it.v.multiplyScalar(1 - 0.26 * dt);
            it.r.x += it.rs.x * dt;
            it.r.y += it.rs.y * dt;
            it.r.z += it.rs.z * dt;
            if (it.p.z > 140 || it.p.y < -48 || Math.abs(it.p.x) > 85) respawnPetal(it, false);
            d.position.copy(it.p);
            d.rotation.copy(it.r);
            d.scale.set(it.sc, it.sc * 0.3, it.sc * 0.8);
            d.updateMatrix();
            petals.setMatrixAt(i, d.matrix);
          }
          petals.instanceMatrix.needsUpdate = true;
        });
      }
      function respawnPetal(it, scatter) {
        const e = pick(blossomEmitters.length ? blossomEmitters : [v3(0, 15, 0)]);
        it.p.set(e.x + rr(-4, 4), e.y + rr(-3, 3), e.z + rr(-4, 4));
        if (scatter) it.p.z += rr(0, 90);
        it.v.set(rr(-1.2, 1.4), rr(-0.6, 0.5), rr(2.2, 5.4));
      }
      var cranes = [];
      function makeCrane() {
        const g = new THREE.Group(),
          white = std({ color: 16184042, roughness: 0.85 }),
          black = std({ color: 2828336 });
        const body = M(new THREE.SphereGeometry(1, 20, 14), white);
        body.scale.set(0.85, 0.75, 2.1);
        g.add(body);
        const tail = M(new THREE.ConeGeometry(0.5, 1.8, 10), black);
        tail.rotation.x = -Math.PI / 2 - 0.4;
        tail.position.set(0, 0.15, -2.4);
        g.add(tail);
        g.add(
          M(
            new THREE.TubeGeometry(
              new THREE.CatmullRomCurve3([
                v3(0, 0.3, 1.8),
                v3(0, 1, 2.6),
                v3(0, 1.7, 3.2),
                v3(0, 2, 3.9),
              ]),
              12,
              0.22,
              8
            ),
            white
          )
        );
        g.add(M(new THREE.SphereGeometry(0.42, 14, 10), white, 0, 2.05, 4.1));
        g.add(M(new THREE.SphereGeometry(0.2, 10, 8), std({ color: 13712172 }), 0, 2.35, 4.05));
        const beak = M(new THREE.ConeGeometry(0.12, 0.7, 8), std({ color: 4867648 }), 0, 2, 4.6);
        beak.rotation.x = Math.PI / 2;
        g.add(beak);
        for (const s of [-1, 1]) {
          const leg = M(
            new THREE.CylinderGeometry(0.06, 0.06, 2.2, 6),
            black,
            s * 0.25,
            -0.2,
            -2.6
          );
          leg.rotation.x = Math.PI / 2 - 0.15;
          g.add(leg);
        }
        const wings = [];
        for (const side of [-1, 1]) {
          const pivot = new THREE.Group();
          pivot.position.set(side * 0.6, 0.45, -0.3);
          g.add(pivot);
          pivot.add(
            M(
              finGeo(4.6, 2, 0.32, side, 16184042, 2828336, 0.08),
              std({ vertexColors: true, roughness: 0.85, side: THREE.DoubleSide })
            )
          );
          wings.push({ pivot, side });
        }
        return { g, wings };
      }
      function buildCranes() {
        [
          { r: 62, y: 16, sp: 0.13, ph: 0, sc: 1, cy: 0 },
          { r: 78, y: 6, sp: -0.1, ph: 2.1, sc: 0.88, cy: -4 },
          { r: 52, y: 27, sp: 0.16, ph: 4, sc: 0.95, cy: 2 },
          { r: 112, y: -2, sp: 0.075, ph: 1.1, sc: 1.12, cy: -8 },
          { r: 70, y: 36, sp: -0.14, ph: 5.2, sc: 0.8, cy: 4 },
        ].forEach((s) => {
          const c = makeCrane();
          c.g.scale.setScalar(s.sc);
          craneGroup.add(c.g);
          cranes.push({ ...c, ...s, t: s.ph });
        });
        updaters.push((dt, t) => {
          for (const c of cranes) {
            c.t += dt * c.sp;
            const R = c.r + Math.sin(c.t * 0.6 + c.ph) * 9,
              y = c.y + Math.sin(c.t * 0.9 + c.ph) * 4.5 + c.cy + Math.sin(t * 0.5 + c.ph) * 1.2;
            const px = Math.cos(c.t) * R,
              pz = Math.sin(c.t) * R,
              nx = Math.cos(c.t + 0.06) * R,
              nz = Math.sin(c.t + 0.06) * R;
            c.g.position.set(px, y, pz);
            const dir = v3(nx - px, Math.cos(c.t * 0.9 + c.ph) * 0.27, nz - pz).normalize();
            c.g.lookAt(c.g.position.clone().add(dir.multiplyScalar(c.sp > 0 ? 1 : -1)));
            c.g.rotation.z += Math.sin(c.t * 1.6) * 0.16 * (c.sp > 0 ? 1 : -1);
            const flap = Math.sin(t * 3.4 + c.ph * 2);
            c.wings.forEach((w) => {
              w.pivot.rotation.z = -w.side * (flap * 0.62 + 0.1);
            });
          }
        });
      }
      var VIEWS = [
        {
          n: '\u9060\u666F \xB7 wide orbit',
          d: 'cinematic drift',
          th: 0.92,
          ph: 1.235,
          r: 190,
          tg: v3(0, 6, 4),
        },
        {
          n: '\u9CE5\u5C45 \xB7 the torii',
          d: 'bow before the gate',
          th: 3.02,
          ph: 1.34,
          r: 72,
          tg: v3(-1, 12, -24),
        },
        {
          n: '\u5EAD\u5712 \xB7 the garden',
          d: 'tea house & bridge',
          th: 0.55,
          ph: 0.94,
          r: 80,
          tg: v3(-1, 12, 0),
        },
        {
          n: '\u96F2\u6D77 \xB7 cloud sea',
          d: 'beneath the falls',
          th: 2.25,
          ph: 1.8,
          r: 172,
          tg: v3(0, -4, 10),
        },
        {
          n: '\u8776\u5C3E \xB7 butterfly tail',
          d: 'ribbons in the wind',
          th: 0.12,
          ph: 1.28,
          r: 126,
          tg: v3(0, 2, 44),
        },
      ];
      var rig = {
        th: 0.92,
        ph: 1.235,
        r: 190,
        tg: v3(0, 6, 4),
        auto: true,
        spd: 0.055,
        tth: 0.92,
        tph: 1.235,
        tr: 190,
        ttg: v3(0, 6, 4),
        blend: 0,
      };
      function gotoView(i) {
        const v = VIEWS[i];
        rig.tth = v.th;
        rig.tph = v.ph;
        rig.tr = v.r;
        rig.ttg = v.tg.clone();
        rig.blend = 1;
        document.querySelectorAll('.chip').forEach((c, k) => c.classList.toggle('on', k === i));
        const kEl = document.querySelector('#cap .k'),
          dEl = document.querySelector('#cap .d');
        kEl.style.opacity = 0;
        dEl.style.opacity = 0;
        setTimeout(() => {
          kEl.textContent = v.n;
          dEl.textContent = v.d;
          kEl.style.opacity = 1;
          dEl.style.opacity = 1;
        }, 260);
      }
      var dragging = false;
      var lastX = 0;
      var lastY = 0;
      var idle = 0;
      renderer.domElement.addEventListener('pointerdown', (e) => {
        dragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        idle = 0;
      });
      addEventListener('pointerup', () => (dragging = false));
      addEventListener('pointermove', (e) => {
        if (!dragging) return;
        rig.tth -= (e.clientX - lastX) * 52e-4;
        rig.tph = clamp(rig.tph - (e.clientY - lastY) * 42e-4, 0.22, 1.86);
        lastX = e.clientX;
        lastY = e.clientY;
        idle = 0;
      });
      renderer.domElement.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          rig.tr = clamp(rig.tr * Math.exp(e.deltaY * 85e-5), 42, 520);
          idle = 0;
        },
        { passive: false }
      );
      addEventListener('keydown', (e) => {
        if (e.key >= '1' && e.key <= '5') gotoView(+e.key - 1);
        if (e.code === 'Space') {
          e.preventDefault();
          toggle('swOrbit');
        }
        if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('noui');
      });
      function toggle(id) {
        const el = document.getElementById(id),
          on = !el.classList.contains('on');
        el.classList.toggle('on', on);
        if (id === 'swOrbit') rig.auto = on;
        if (id === 'swBloom') bloom.enabled = on;
        if (id === 'swWater') streamsGroup.visible = on;
        if (id === 'swPetals') petals.visible = on;
      }
      ['swOrbit', 'swBloom', 'swWater', 'swPetals'].forEach((id) =>
        document.getElementById(id).addEventListener('click', () => toggle(id))
      );
      document.getElementById('sldSpeed').addEventListener('input', (e) => {
        rig.spd = 0.055 * (e.target.value / 70);
      });
      document.getElementById('sldSun').addEventListener('input', (e) => {
        setSun(0.02 + (e.target.value / 100) * 0.48);
      });
      document.getElementById('sldSun').addEventListener('change', () => updateEnv());
      document
        .querySelectorAll('.chip')
        .forEach((c) => c.addEventListener('click', () => gotoView(+c.dataset.v)));
      document
        .getElementById('uiBack')
        .addEventListener('click', () => document.body.classList.remove('noui'));
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
      });
      var clock = new THREE.Clock();
      var fpsAcc = 0;
      var fpsN = 0;
      var camTarget = new THREE.Vector3();
      renderer.info.autoReset = false;
      function animate() {
        renderer.info.reset();
        const dt = Math.min(clock.getDelta(), 0.05),
          t = clock.elapsedTime;
        koiGroup.position.y = Math.sin(t * 0.42) * 1.6;
        koiGroup.position.x = Math.sin(t * 0.24) * 1;
        koiGroup.rotation.z = Math.sin(t * 0.37) * 0.02;
        koiGroup.rotation.x = Math.sin(t * 0.29) * 0.014;
        koiGroup.rotation.y = Math.sin(t * 0.31) * 0.026;
        updateKoiBody(t);
        updateTail(t);
        TEX.water.offset.set(t * 0.012, t * 8e-3);
        for (const s of swayers) {
          s.g.rotation.z = Math.sin(t * 0.9 + s.ph) * s.amp;
          s.g.rotation.x = Math.cos(t * 0.7 + s.ph) * s.amp * 0.7;
        }
        for (const u of updaters) u(dt, t);
        if (rig.blend > 0) {
          rig.blend = Math.max(0, rig.blend - dt * 0.55);
          const k = 1 - Math.pow(rig.blend, 2.2);
          rig.th = lerp(rig.th, rig.tth, k * dt * 3.4);
          rig.ph = lerp(rig.ph, rig.tph, k * dt * 3.4);
          rig.r = lerp(rig.r, rig.tr, k * dt * 3);
          rig.tg.lerp(rig.ttg, k * dt * 3);
        } else {
          const k = 1 - Math.pow(1e-3, dt);
          rig.th = lerp(rig.th, rig.tth, k);
          rig.ph = lerp(rig.ph, rig.tph, k);
          rig.r = lerp(rig.r, rig.tr, k);
          rig.tg.lerp(rig.ttg, k);
        }
        idle += dt;
        if (rig.auto && !dragging && idle > 1.2) rig.tth += rig.spd * dt;
        const r = rig.r + Math.sin(t * 0.11) * 7,
          ph = clamp(rig.ph + Math.sin(t * 0.07) * 0.014, 0.15, 1.9);
        camTarget.copy(rig.tg);
        camTarget.y += Math.sin(t * 0.083) * 4.5;
        camera.position.set(
          camTarget.x + r * Math.sin(ph) * Math.sin(rig.th),
          camTarget.y + r * Math.cos(ph),
          camTarget.z + r * Math.sin(ph) * Math.cos(rig.th)
        );
        camera.lookAt(camTarget);
        composer.render();
        fpsAcc += dt;
        fpsN++;
        if (fpsAcc > 0.5) {
          document.getElementById('statFps').textContent = Math.round(fpsN / fpsAcc);
          document.getElementById('statTris').textContent =
            (renderer.info.render.triangles / 1e3).toFixed(0) + 'k';
          fpsAcc = 0;
          fpsN = 0;
        }
      }
      var frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      function setProgress(p, txt) {
        document.getElementById('barFill').style.width = p * 100 + '%';
        document.getElementById('loadPct').textContent = Math.round(p * 100) + '%';
        if (txt) document.getElementById('loadStep').textContent = txt;
      }
      var STEPS = [
        [
          0.08,
          'mixing paints\u2026',
          () => {
            buildTextures();
            buildMaterials();
          },
        ],
        [
          0.18,
          'painting the sunset sky\u2026',
          () => {
            buildSky();
          },
        ],
        [
          0.28,
          'raising the cloud sea\u2026',
          () => {
            buildClouds();
          },
        ],
        [
          0.36,
          'kindling the light\u2026',
          () => {
            buildLights();
          },
        ],
        [
          0.52,
          'sculpting the giant koi\u2026',
          () => {
            buildKoiBody();
            buildHead();
            buildFins();
            buildTail();
          },
        ],
        [
          0.66,
          'terracing the garden\u2026',
          () => {
            buildTerrain();
            buildPond();
            buildBridge();
          },
        ],
        [
          0.78,
          'raising the tea house\u2026',
          () => {
            buildTeaHouse();
            buildTorii();
            buildStoneLantern(4.3, -7.8, 1);
            buildStoneLantern(-4.8, 20.5, 0.7);
          },
        ],
        [
          0.88,
          'planting sakura & bamboo\u2026',
          () => {
            buildTrees();
            buildBamboo();
          },
        ],
        [
          0.96,
          'releasing the waterfalls\u2026',
          () => {
            buildWater();
            buildCranes();
            buildPetals();
          },
        ],
        [
          1,
          'ready',
          () => {
            setSun(0.2);
            document.getElementById('sldSun').value = Math.round(((0.2 - 0.02) / 0.48) * 100);
          },
        ],
      ];
      (async function boot() {
        const L = document.getElementById('loader');
        for (let i = 0; i < 10; i++) {
          const p = document.createElement('div');
          p.className = 'lp';
          p.style.left = rnd() * 100 + 'vw';
          p.style.animationDuration = rr(7, 15) + 's';
          p.style.animationDelay = -rnd() * 12 + 's';
          p.style.opacity = rr(0.3, 0.8);
          L.appendChild(p);
        }
        await frame();
        try {
          for (const [p, txt, fn] of STEPS) {
            setProgress(p, txt);
            await frame();
            fn();
            await frame();
          }
          camera.position.set(140, 58, 110);
          camera.lookAt(0, 6, 0);
          renderer.setAnimationLoop(animate);
          setTimeout(() => L.classList.add('gone'), 420);
          setTimeout(() => {
            L.style.display = 'none';
          }, 1500);
        } catch (err) {
          console.error('Scene initialization failed:', err);
          document.getElementById('loadStep').textContent =
            'Unable to start the 3D scene: ' + err.message;
          document.getElementById('loadPct').textContent = '!';
        }
      })();
    </script>
  </body>
