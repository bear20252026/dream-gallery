      const fireflyMaterial = new THREE.MeshBasicMaterial({ vertexColors: true, fog: false });
      const fireflies = new THREE.InstancedMesh(fireflyGeometry, fireflyMaterial, flyCount);
      fireflies.frustumCulled = false;
      fireflies.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      const haloGeometry = whiteColors(new THREE.SphereGeometry(0.17, 10, 8));
      const haloMaterial = new THREE.MeshBasicMaterial({
        vertexColors: true,
        fog: false,
        transparent: true,
        opacity: 0.16,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });
      const fireflyHalos = new THREE.InstancedMesh(haloGeometry, haloMaterial, flyCount);
      fireflyHalos.frustumCulled = false;
      fireflyHalos.renderOrder = 4;
      fireflyHalos.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      scene.add(fireflies, fireflyHalos);

      const flyStates = [];
      for (let i = 0; i < flyCount; i++) {
        const angle = rr(0, Math.PI * 2);
        const radius = rr(2.3, 10.5);
        flyStates.push({
          cx: Math.cos(angle) * radius + rr(-1, 1),
          cz: Math.sin(angle) * radius + rr(-1, 1),
          cy: rr(1.0, 3.8),
          phase: rr(0, Math.PI * 2),
          speed: rr(0.5, 1.3),
          blink: rr(0.6, 1.35),
          size: rr(0.7, 1.45),
        });
      }
      const flyDummy = new THREE.Object3D();
      const flyColor = new THREE.Color();
      const flyHaloColor = new THREE.Color();
      for (let i = 0; i < flyCount; i++) {
        fireflies.setColorAt(i, flyColor.setRGB(0.15, 0.1, 0.03));
        fireflyHalos.setColorAt(i, flyHaloColor.setRGB(0.04, 0.025, 0.008));
      }

      const seedCount = useLiteField ? 38 : 62;
      const seedBatch = new PrimBatch();
      seedBatch.cyl(0.006, 0.006, 0.2, 5, 0, 0.1, 0, 0xd6c6a3);
      seedBatch.sphere(0.016, 6, 5, 0, 0.0, 0, 0x9a7b4f, { scale: [1, 1.8, 1] });
      seedBatch.cone(0.1, 0.05, 8, 0, 0.215, 0, 0xfff4dc, {
        rx: Math.PI,
        topBoost: 1,
        bottomShade: 1,
      });
      seedBatch.ico(0.03, 1, 0, 0.2, 0, 0xfff0d1);
      const seedGeometry = seedBatch.geometry();
      const seedMaterial = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.9,
        metalness: 0,
        side: THREE.DoubleSide,
        emissive: 0xffe2b0,
        emissiveIntensity: 0.2,
      });
      const seeds = new THREE.InstancedMesh(seedGeometry, seedMaterial, seedCount);
      seeds.frustumCulled = false;
      seeds.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      seeds.castShadow = false;
      seeds.receiveShadow = false;
      scene.add(seeds);
      const seedStates = [];
      const seedColor = new THREE.Color();
      for (let i = 0; i < seedCount; i++) {
        seedStates.push({
          x: rr(-14, 14),
          z: rr(-14, 18),
          y: rr(0.4, 8.2),
          speed: rr(0.14, 0.36),
          phase: rr(0, Math.PI * 2),
          spin: rr(-0.5, 0.5),
          size: rr(0.7, 1.45),
        });
        seeds.setColorAt(i, seedColor.setRGB(rr(0.9, 1.2), rr(0.82, 1.05), rr(0.68, 0.88)));
      }
      if (seeds.instanceColor) seeds.instanceColor.needsUpdate = true;
      const seedDummy = new THREE.Object3D();

      /* ------------------------------------------------------------------
   DISTANT BIRDS
------------------------------------------------------------------ */
      const birds = [];
      const birdMaterial = new THREE.MeshBasicMaterial({ color: 0x4a332a, fog: false });
      const birdBodyGeo = new THREE.CapsuleGeometry(0.09, 0.36, 3, 8);
      birdBodyGeo.rotateZ(Math.PI / 2);
      const birdHeadGeo = new THREE.SphereGeometry(0.1, 8, 6);
      birdHeadGeo.translate(0.3, 0.05, 0);
      const birdWingGeo = new THREE.SphereGeometry(0.3, 8, 5);
      birdWingGeo.scale(0.3, 0.07, 1);
      birdWingGeo.translate(0, 0, 0.3);
      for (let i = 0; i < 6; i++) {
        const bird = new THREE.Group();
        const body = new THREE.Mesh(birdBodyGeo, birdMaterial);
        const headMesh = new THREE.Mesh(birdHeadGeo, birdMaterial);
        const wingL = new THREE.Mesh(birdWingGeo, birdMaterial);
        wingL.position.set(0, 0.05, 0.06);
        const wingR = new THREE.Mesh(birdWingGeo, birdMaterial);
        wingR.position.set(0, 0.05, -0.06);
        wingR.rotation.y = Math.PI;
        bird.add(body, headMesh, wingL, wingR);
        const dir = rnd() > 0.5 ? 1 : -1;
        bird.position.set(rr(-150, 150), rr(17, 30), rr(-120, -70));
        bird.scale.setScalar(rr(1.1, 1.9));
        if (dir < 0) bird.rotation.y = Math.PI;
        scene.add(bird);
        birds.push({
          group: bird,
          wingL,
          wingR,
          dir,
          speed: rr(2.2, 4.2),
          flap: rr(5.5, 8.5),
          phase: rr(0, Math.PI * 2),
          baseY: bird.position.y,
          bob: rr(0.4, 1.1),
        });
      }

      /* ------------------------------------------------------------------
   DAMPED CAMERA ORBIT + CINEMATIC IDLE + FOX INPUT
------------------------------------------------------------------ */
      let elapsed = 0;
      const orbit = {
        target: new THREE.Vector3(fox.pos.x, fox.pos.y + 1.15, fox.pos.z),
        baseYaw: 0.15,
        yaw: 0.15,
        polar: 1.4,
        targetPolar: 1.4,
        radius: 11.5,
        targetRadius: 11.5,
        autoPhase: 0.42,
        lastInteraction: performance.now() - 5000,
      };
      const pointers = new Map();
      let pinchStartDistance = 0;
      let pinchStartRadius = orbit.targetRadius;

      function pointerDistance() {
        const arr = [...pointers.values()];
        return Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
      }

      const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -FOX_Y);
      const clickRaycaster = new THREE.Raycaster();
      const clickNDC = new THREE.Vector2();
      const clickHit = new THREE.Vector3();
      let lastClickTime = 0;

      // Tap the ground: walk there. Double-tap / Shift+tap: run. Tap the fox: jump.
      function handleSceneClick(event) {
        clickNDC.x = (event.clientX / window.innerWidth) * 2 - 1;
        clickNDC.y = -(event.clientY / window.innerHeight) * 2 + 1;
        clickRaycaster.setFromCamera(clickNDC, camera);
        _tmpVec.set(fox.pos.x, fox.pos.y + 0.75, fox.pos.z);
        if (clickRaycaster.ray.distanceSqToPoint(_tmpVec) < 0.8) {
          foxJump();
          fox.userUntil = elapsed + 5;
          return;
        }
        if (clickRaycaster.ray.intersectPlane(groundPlane, clickHit)) {
          const now = performance.now();
          const isDouble = now - lastClickTime < 340;
          lastClickTime = now;
          foxSetGoal(clickHit.x, clickHit.z, isDouble || event.shiftKey, 'stand');
          fox.userUntil = elapsed + 9;
        }
      }

      // WASD / arrows: walk. Shift: run. Space: jump. C or X: sit / stand.
      const keys = {};
      window.addEventListener('keydown', (event) => {
        keys[event.code] = true;
        if (event.key) keys[event.key.toLowerCase()] = true;
        if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code))
          event.preventDefault();
        if (event.repeat) return;
        if (event.code === 'Space') {
          foxJump();
          fox.userUntil = elapsed + 5;
        }
        if (event.code === 'KeyC' || event.code === 'KeyX') {
          foxToggleSit();
          fox.userUntil = elapsed + 7;
        }
      });
      window.addEventListener('keyup', (event) => {
        keys[event.code] = false;
        if (event.key) keys[event.key.toLowerCase()] = false;
      });
      window.addEventListener('blur', () => {
        for (const k in keys) keys[k] = false;
      });

      canvas.addEventListener('pointerdown', (event) => {
        canvas.setPointerCapture(event.pointerId);
        pointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY,
          startX: event.clientX,
          startY: event.clientY,
          startTime: performance.now(),
        });
        orbit.lastInteraction = performance.now();
        canvas.classList.add('dragging');
        if (pointers.size === 2) {
          pinchStartDistance = Math.max(1, pointerDistance());
          pinchStartRadius = orbit.targetRadius;
        }
      });

      canvas.addEventListener('pointermove', (event) => {
        const prev = pointers.get(event.pointerId);
        if (!prev) return;
        orbit.lastInteraction = performance.now();
        if (pointers.size >= 2) {
          prev.x = event.clientX;
          prev.y = event.clientY;
          const dist = Math.max(1, pointerDistance());
          orbit.targetRadius = clamp(pinchStartRadius * (pinchStartDistance / dist), 5.5, 22);
          return;
        }
        const dx = event.clientX - prev.x;
        const dy = event.clientY - prev.y;
        orbit.baseYaw = clamp(orbit.baseYaw - dx * 0.0042, -0.62, 0.62);
        orbit.targetPolar = clamp(orbit.targetPolar + dy * 0.0034, 0.88, 1.47);
        prev.x = event.clientX;
        prev.y = event.clientY;
      });

      function releasePointer(event) {
        const p = pointers.get(event.pointerId);
        if (p && pointers.size === 1 && event.type === 'pointerup') {
          const moved = Math.hypot(event.clientX - p.startX, event.clientY - p.startY);
          const duration = performance.now() - p.startTime;
          if (moved < 7 && duration < 500) handleSceneClick(event);
        }
        pointers.delete(event.pointerId);
        if (pointers.size < 2) pinchStartDistance = 0;
        if (pointers.size === 0) canvas.classList.remove('dragging');
        orbit.lastInteraction = performance.now();
      }
      canvas.addEventListener('pointerup', releasePointer);
      canvas.addEventListener('pointercancel', releasePointer);
      canvas.addEventListener(
        'wheel',
        (event) => {
          event.preventDefault();
          orbit.targetRadius = clamp(
            orbit.targetRadius * Math.exp(event.deltaY * 0.00085),
            5.5,
            22
          );
          orbit.lastInteraction = performance.now();
        },
        { passive: false }
      );
      window.addEventListener('contextmenu', (event) => event.preventDefault());

      function updateCamera(dt) {
        const idleFor = (performance.now() - orbit.lastInteraction) / 1000;
        if (idleFor > 3.4) orbit.autoPhase += dt * 0.115;
        const autoYaw = Math.sin(orbit.autoPhase) * 0.4;
        const yawTarget = clamp(orbit.baseYaw + autoYaw, -0.98, 0.98);
        orbit.yaw = damp(orbit.yaw, yawTarget, 2.9, dt);
        orbit.polar = damp(orbit.polar, orbit.targetPolar, 3.8, dt);
        orbit.radius = damp(orbit.radius, orbit.targetRadius, 4.2, dt);

        // keep the fox as the focal point
        orbit.target.x = damp(orbit.target.x, fox.pos.x, 2.8, dt);
        orbit.target.y = damp(orbit.target.y, FOX_Y + 1.15 + fox.jumpY * 0.5, 3.2, dt);
        orbit.target.z = damp(orbit.target.z, fox.pos.z, 2.8, dt);

        const sinPolar = Math.sin(orbit.polar);
        camera.position.set(
          orbit.target.x + orbit.radius * sinPolar * Math.sin(orbit.yaw),
          orbit.target.y + orbit.radius * Math.cos(orbit.polar),
          orbit.target.z + orbit.radius * sinPolar * Math.cos(orbit.yaw)
        );
        // gentle handheld sway and bob
        camera.position.y += Math.sin(elapsed * 0.42) * 0.08;
        camera.position.x += Math.sin(elapsed * 0.31 + 1.3) * 0.05;
        camera.position.z += Math.cos(elapsed * 0.27 + 0.5) * 0.05;
        camera.lookAt(orbit.target);
      }

      /* ------------------------------------------------------------------
   FOX BRAIN + LOCOMOTION + POSE
------------------------------------------------------------------ */
      const _fwd = new THREE.Vector3();
      const _right = new THREE.Vector3();

      function updateFox(dt) {
        const f = fox;

        // ---- intent: keyboard > click goal > autonomous life ----
        camera.getWorldDirection(_fwd);
        _fwd.y = 0;
        if (_fwd.lengthSq() < 1e-6) _fwd.set(0, 0, -1);
        _fwd.normalize();
        _right.set(-_fwd.z, 0, _fwd.x);

        let ix = 0,
          iz = 0;
        if (keys.KeyW || keys.ArrowUp || keys.w) {
          ix += _fwd.x;
          iz += _fwd.z;
        }
        if (keys.KeyS || keys.ArrowDown || keys.s) {
          ix -= _fwd.x;
          iz -= _fwd.z;
        }
        if (keys.KeyD || keys.ArrowRight || keys.d) {
          ix += _right.x;
          iz += _right.z;
        }
        if (keys.KeyA || keys.ArrowLeft || keys.a) {
          ix -= _right.x;
          iz -= _right.z;
        }
        const inputLen = Math.hypot(ix, iz);

        if (inputLen > 0.01) {
          const wantsRun = keys.ShiftLeft || keys.ShiftRight || keys.shift;
          f.hasGoal = false;
          f.sitting = false;
          f.userUntil = elapsed + 6;
          f.idle = 0;
          f.targetHeading = Math.atan2(ix, iz);
          f.targetSpeed = wantsRun ? RUN_SPEED : WALK_SPEED;
        } else if (f.hasGoal) {
          const dx = f.goal.x - f.pos.x;
          const dz = f.goal.z - f.pos.z;
          const dist = Math.hypot(dx, dz);
          f.goalTime += dt;
          if (dist > 0.45 && f.goalTime < 14) {
            f.targetHeading = Math.atan2(dx, dz);
            f.targetSpeed = Math.min(f.goalRun ? RUN_SPEED : WALK_SPEED, 1.2 + dist * 2.2);
          } else {
            f.hasGoal = false;
            f.targetSpeed = 0;
            f.idle = 0;
            if (f.goalThen === 'jump') foxJump();
            else if (f.goalThen === 'sit') {
              f.sitting = true;
              foxFaceCamera();
            }
          }
        } else {
          f.targetSpeed = 0;
          if (elapsed > f.userUntil && !f.airborne) {
            f.idle += dt;
            if (f.idle > f.nextAction) {
              f.idle = 0;
              f.nextAction = rr(3.5, 7.5);
              const roll = rnd();
              if (f.sitting) {
                if (roll < 0.62) foxWander();
                else if (roll < 0.8) foxJump();
              } else {
                if (roll < 0.45) {
                  f.sitting = true;
                  foxFaceCamera();
                } else if (roll < 0.6) foxJump();
                else foxWander();
              }
            }
          }
        }

        // ---- locomotion ----
        f.sit = damp(f.sit, f.sitting && !f.airborne && f.speed < 0.35 ? 1 : 0, 6.5, dt);
        const canMove = !f.sitting && f.sit < 0.35;
        const tgt = canMove ? f.targetSpeed : 0;
        f.speed = damp(f.speed, tgt, tgt > f.speed ? 4.5 : 7.0, dt);
        if (f.speed < 0.01) f.speed = 0;

        f.heading +=
          wrapAngle(f.targetHeading - f.heading) * Math.min(1, dt * (f.speed > 0.3 ? 7.5 : 4.5));
        f.heading = wrapAngle(f.heading);

        f.pos.x += Math.sin(f.heading) * f.speed * dt;
        f.pos.z += Math.cos(f.heading) * f.speed * dt;

        const centerDist = Math.hypot(f.pos.x, f.pos.z);
        if (centerDist > FIELD_R) {
          f.pos.x *= FIELD_R / centerDist;
          f.pos.z *= FIELD_R / centerDist;
        }
        const tdx = f.pos.x - TREE_X,
          tdz = f.pos.z - TREE_Z;
        const treeDist = Math.hypot(tdx, tdz);
        if (treeDist < 1.35 && treeDist > 0.0001) {
          f.pos.x = TREE_X + (tdx / treeDist) * 1.35;
          f.pos.z = TREE_Z + (tdz / treeDist) * 1.35;
        }

        if (f.airborne) {
          f.jumpVy -= 20 * dt;
          f.jumpY += f.jumpVy * dt;
          if (f.jumpY <= 0) {
            f.jumpY = 0;
            f.jumpVy = 0;
            f.airborne = false;
            spawnDust(f.pos.x, GROUND_Y, f.pos.z, 6);
          }
        }
        f.pos.y = FOX_Y + f.jumpY;
        foxRig.root.position.copy(f.pos);
        foxRig.root.rotation.y = f.heading;

        if (f.speed > 4.2 && !f.airborne) {
          f.dustTimer += dt;
          if (f.dustTimer > 0.11) {
            f.dustTimer = 0;
            spawnDust(
              f.pos.x - Math.sin(f.heading) * 0.5,
              GROUND_Y,
              f.pos.z - Math.cos(f.heading) * 0.5,
              1
            );
          }
        }

        // ---- pose ----
        const sit = f.sit;
        f.move = damp(f.move, clamp(f.speed / 1.2, 0, 1), 10, dt);
        const move = f.move;
        const run = clamp((f.speed - 2.8) / 2.6, 0, 1);
        const air = clamp(f.jumpY * 2.4, 0, 1);
        f.gait += dt * f.speed * 4.7;
        f.gallop += dt * f.speed * 2.8;

        const sg = Math.sin(f.gait),
          cg = Math.cos(f.gait);
        const g2 = f.gallop;

        // walk = diagonal pairs, run = bounding gallop (fronts reach while hinds push)
        let fl = lerp(sg * 0.45, Math.sin(g2 + 0.35) * 0.8, run) * move;
        let fr = lerp(-sg * 0.45, Math.sin(g2 + 0.05) * 0.8, run) * move;
        let hl = lerp(-sg * 0.42, Math.sin(g2 + 2.6) * 0.85, run) * move;
        let hr = lerp(sg * 0.42, Math.sin(g2 + 2.9) * 0.85, run) * move;
        let kl = lerp(Math.max(0, cg), Math.max(0, -Math.cos(g2 + 2.6)), run) * 0.6 * move;
        let kr = lerp(Math.max(0, -cg), Math.max(0, -Math.cos(g2 + 2.9)), run) * 0.6 * move;

        // leap: fronts reach forward, hinds trail and tuck
        fl = lerp(fl, -0.7, air);
        fr = lerp(fr, -0.6, air);
        hl = lerp(hl, 0.75, air);
        hr = lerp(hr, 0.68, air);
        kl = lerp(kl, 0.5, air);
        kr = lerp(kr, 0.5, air);

        // sit: torso pitches up, front legs stay planted, hind legs fold forward
        // (front legs cancel the torso pitch so they stay vertical; the hind legs
        //  fold forward along the ground with the paws planted beside the front ones)
        foxRig.legFL.rotation.x = lerp(fl, 0.85, sit);
        foxRig.legFR.rotation.x = lerp(fr, 0.85, sit);
        foxRig.legHL.rotation.x = lerp(hl, -0.75, sit);
        foxRig.legHR.rotation.x = lerp(hr, -0.75, sit);
        foxRig.legHL.rotation.z = -0.28 * sit;
        foxRig.legHR.rotation.z = 0.28 * sit;
        foxRig.shinL.rotation.x = lerp(kl, 1.0, sit);
        foxRig.shinR.rotation.x = lerp(kr, 1.0, sit);

        const breathe = Math.sin(elapsed * 1.5);
        const bounce = Math.max(0, Math.sin(g2 + 0.9)) * 0.13 * run * move;
        const bob = -0.05 * sg * sg * (1 - run) * move;
        foxRig.torso.position.set(
          0,
          lerp(0.8 + bounce + bob, 0.29, sit) + breathe * 0.004,
          lerp(-0.42, -0.35, sit)
        );
        const pitchAir = clamp(f.jumpVy * 0.05, -0.32, 0.32) * air;
        const spine = Math.sin(g2 + 0.6) * 0.16 * run * move;
        foxRig.torso.rotation.x = lerp(spine - pitchAir, -0.85, sit) + breathe * 0.008;
        foxRig.torso.rotation.z = sg * 0.035 * move * (1 - run) * (1 - sit);

        // head: watch the viewer when resting, look ahead when travelling
        let yawWanted = 0;
        if (f.speed < 0.3) {
          const toCam = wrapAngle(
            Math.atan2(camera.position.x - f.pos.x, camera.position.z - f.pos.z) - f.heading
          );
          yawWanted = clamp(toCam, -0.9, 0.9) * 0.75;
        }
        foxRig.head.rotation.y = damp(foxRig.head.rotation.y, yawWanted, 4, dt);
        foxRig.head.rotation.x =
          lerp(-spine * 0.6 + pitchAir * 0.5, 0.8, sit) + Math.sin(elapsed * 0.8) * 0.02;
        foxRig.head.rotation.z = Math.sin(elapsed * 0.43 + 0.7) * 0.03 * (1 - move);

        // ears: occasional twitches, laid back at speed
        const twitchL = Math.pow(Math.max(0, Math.sin(elapsed * 0.61 + 1.75)), 18);
        const twitchR = Math.pow(Math.max(0, Math.sin(elapsed * 0.53 + 4.55)), 20);
        foxRig.earL.rotation.z = 0.2 + Math.sin(elapsed * 43) * 0.22 * twitchL;
        foxRig.earR.rotation.z = -0.2 - Math.sin(elapsed * 39 + 1.2) * 0.2 * twitchR;
        foxRig.earL.rotation.x = Math.sin(elapsed * 27) * 0.05 * twitchL - run * 0.35;
        foxRig.earR.rotation.x = Math.sin(elapsed * 31 + 0.6) * 0.045 * twitchR - run * 0.35;

        // tail: kept level against the torso pitch, then curved along its length
        foxRig.tailGroup.rotation.x = -foxRig.torso.rotation.x;
        const flick = Math.pow(Math.max(0, Math.sin(elapsed * 0.21 + 2.2)), 10);
        const sway = Math.sin(f.gait * 0.5);
        const swayLag = Math.sin(f.gait * 0.5 - 1.0);
        const dynYaw = sway * 0.25 * move + Math.sin(elapsed * 0.9) * 0.08 * (1 - move);
        const dynCurl = swayLag * 0.4 * move + Math.sin(elapsed * 0.7 + 1.0) * 0.12 * (1 - move);
        const dynPitch = lerp(lerp(-0.5, -0.12, run), 0.15, air);
        const dynPitchCurl = lerp(lerp(0.55, 0.3 + Math.sin(g2 * 2) * 0.12 * run, run), 0.2, air);
        updateTail(
          foxRig.tailGeo,
          lerp(dynYaw, 1.0 + Math.sin(elapsed * 0.92) * 0.06 + flick * 0.3, sit),
          lerp(dynCurl, 2.2 + Math.sin(elapsed * 0.6) * 0.08 - flick * 0.35, sit),
          lerp(dynPitch, 0.3, sit),
          lerp(dynPitchCurl, -0.45, sit)
        );

        wheatUniforms.uFox.value.copy(f.pos);
      }

      /* ------------------------------------------------------------------
   ONE ANIMATION LOOP
------------------------------------------------------------------ */
      const clock = new THREE.Clock();
      let renderedFrames = 0;
      const fadeElement = document.getElementById('fade');

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        elapsed += dt;

        updateFox(dt);
        updateCamera(dt);
        wheatUniforms.uTime.value = elapsed;

        // sun pulse
        const pulse = Math.sin(elapsed * 0.55);
        sunGroup.scale.setScalar(1 + pulse * 0.022);
        sunHaloMats.forEach((mat, i) => {
          mat.opacity = haloBaseOpacity[i] * (1 + Math.sin(elapsed * 0.55 + i * 0.3) * 0.28);
        });
        const sunBoost = 1 + pulse * 0.06;
        sunCoreMat.color.setRGB(4.8 * sunBoost, 2.9 * sunBoost, 1.25 * sunBoost);
        sunLight.intensity = 3.35 + pulse * 0.07;

        // the apple canopy rustles as loose leaf clusters
        for (let i = 0; i < canopyClusters.length; i++) {
          const { group, base, phase, speed, amount } = canopyClusters[i];
          group.rotation.z = Math.sin(elapsed * 0.72 * speed + phase) * 0.02 * amount;
          group.rotation.x = Math.cos(elapsed * 0.57 * speed + phase * 1.6) * 0.016 * amount;
          group.rotation.y = Math.sin(elapsed * 0.34 + phase) * 0.01;
          group.position.x = base.x + Math.sin(elapsed * 0.38 + phase) * 0.025;
          group.position.y = base.y + Math.sin(elapsed * 0.93 * speed + phase) * 0.028;
          group.position.z = base.z + Math.cos(elapsed * 0.42 + phase * 1.9) * 0.02;
        }

        // drifting, blinking fireflies
        for (let i = 0; i < flyCount; i++) {
          const f = flyStates[i];
          const x =
            f.cx +
            Math.sin(elapsed * 0.27 * f.speed + f.phase) * 1.15 +
            Math.sin(elapsed * 0.11 + f.phase * 2.1) * 0.55;
          const z =
            f.cz +
            Math.cos(elapsed * 0.23 * f.speed + f.phase * 1.7) * 1.0 +
            Math.sin(elapsed * 0.16 + f.phase) * 0.4;
          const y =
            f.cy +
            Math.sin(elapsed * 0.41 * f.speed + f.phase * 1.3) * 0.46 +
            Math.cos(elapsed * 0.17 + f.phase) * 0.18 +
            Math.sin(elapsed * 0.09 + f.phase * 3.1) * 0.9;
          const blink =
            0.07 + 0.93 * Math.pow(Math.max(0, Math.sin(elapsed * f.blink + f.phase * 2.4)), 3);
          flyDummy.position.set(x, y, z);
          flyDummy.rotation.set(0, 0, 0);
          const s = f.size * (0.8 + blink * 0.5);
          flyDummy.scale.set(s, s, s);
          flyDummy.updateMatrix();
          fireflies.setMatrixAt(i, flyDummy.matrix);
          flyDummy.scale.set(s * 1.9, s * 1.9, s * 1.9);
          flyDummy.updateMatrix();
          fireflyHalos.setMatrixAt(i, flyDummy.matrix);
          fireflies.setColorAt(
            i,
            flyColor.setRGB(0.18 + blink * 2.35, 0.1 + blink * 1.62, 0.035 + blink * 0.5)
          );
          fireflyHalos.setColorAt(
            i,
            flyHaloColor.setRGB(0.02 + blink * 0.32, 0.012 + blink * 0.2, 0.005 + blink * 0.06)
          );
        }
        fireflies.instanceMatrix.needsUpdate = true;
        fireflyHalos.instanceMatrix.needsUpdate = true;
        if (fireflies.instanceColor) fireflies.instanceColor.needsUpdate = true;
        if (fireflyHalos.instanceColor) fireflyHalos.instanceColor.needsUpdate = true;

        // dandelion seeds rise, waft, and return to the warm air
        for (let i = 0; i < seedCount; i++) {
          const s = seedStates[i];
          s.y += s.speed * dt;
          if (s.y > 8.8) {
            s.y = rr(0.15, 0.7);
            s.x = rr(-14, 14);
            s.z = rr(-14, 18);
            s.phase = rr(0, Math.PI * 2);
          }
          const x =
            s.x +
            Math.sin(elapsed * 0.31 + s.phase) * 1.1 +
            Math.sin(elapsed * 0.12 + s.phase * 2.3) * 0.42;
          const z = s.z + Math.cos(elapsed * 0.26 + s.phase * 1.6) * 0.85;
          const y = s.y + Math.sin(elapsed * 0.68 + s.phase) * 0.1;
          seedDummy.position.set(x, y, z);
          seedDummy.rotation.set(
            Math.sin(elapsed * 0.55 + s.phase) * 0.42,
            elapsed * s.spin + s.phase,
            Math.cos(elapsed * 0.64 + s.phase) * 0.34
          );
          seedDummy.scale.setScalar(s.size);
          seedDummy.updateMatrix();
          seeds.setMatrixAt(i, seedDummy.matrix);
        }
        seeds.instanceMatrix.needsUpdate = true;

        // distant birds cross the sky
        for (let i = 0; i < birds.length; i++) {
          const b = birds[i];
          b.group.position.x += b.dir * b.speed * dt;
          b.group.position.y = b.baseY + Math.sin(elapsed * b.bob + b.phase) * 0.9;
          if (b.group.position.x > 165) b.group.position.x = -165;
          if (b.group.position.x < -165) b.group.position.x = 165;
          const flap = Math.sin(elapsed * b.flap + b.phase) * 0.55;
          b.wingL.rotation.x = flap;
          b.wingR.rotation.x = -flap;
        }

        // dust puffs
        for (let i = 0; i < DUST_MAX; i++) {
          const p = dustParticles[i];
          if (p.life > 0) {
            p.life -= dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.z += p.vz * dt;
            p.vy -= 1.8 * dt;
            const prog = Math.max(0, p.life / p.maxLife);
            const s = p.scale * (0.35 + 0.65 * Math.sin(prog * Math.PI));
            dustDummy.position.set(p.x, p.y, p.z);
            dustDummy.scale.set(s, s, s);
          } else {
            dustDummy.position.set(0, -20, 0);
            dustDummy.scale.set(0.0001, 0.0001, 0.0001);
          }
          dustDummy.updateMatrix();
          dustMesh.setMatrixAt(i, dustDummy.matrix);
        }
        dustMesh.instanceMatrix.needsUpdate = true;

        composer.render();

        renderedFrames++;
        if (renderedFrames === 3) {
          fadeElement.classList.add('gone');
          window.setTimeout(() => {
            fadeElement.style.display = 'none';
          }, 1800);
        }
      }

      function onResize() {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setPixelRatio(pixelRatio);
        composer.setSize(window.innerWidth, window.innerHeight);
        bloomPass.setSize(window.innerWidth, window.innerHeight);
      }
      window.addEventListener('resize', onResize);

      updateCamera(1);
      animate();
    </script>
  </body>
</html>
